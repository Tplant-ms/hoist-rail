<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホイストレール強度検討書</title>
<style>
  :root{
    --navy:#1F3864; --blue:#2F5597; --bg:#F3F6FB; --card:#FFFFFF; --line:#D8E0EC; --text:#1E2733; --sub:#5A6675;
    --force:#C62828;   /* 力 P */
    --react:#2E7D32;   /* 反力 */
    --bend:#E65100;    /* 曲げ */
    --shear:#6A1B9A;   /* せん断 */
    --defl:#1565C0;    /* たわみ */
    --ok:#1B7F3A; --okbg:#E6F4EA; --ng:#B3261E; --ngbg:#FCE8E6; --tip:#FFF6DC; --tipline:#F0C25A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--text);line-height:1.75;font-size:16px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px 60px}
  header.hero{background:linear-gradient(135deg,#1F3864,#2F5597);color:#fff;padding:26px 18px 22px;border-radius:0 0 18px 18px}
  header.hero .in{max-width:1000px;margin:0 auto}
  header.hero h1{font-size:clamp(20px,4.2vw,30px);line-height:1.4;letter-spacing:.02em}
  header.hero p{opacity:.92;margin-top:6px;font-size:14px}
  .modes{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
  .modes button{flex:1 1 200px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit;font-weight:700;color:var(--sub);cursor:pointer;text-align:left;line-height:1.4}
  .modes button small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
  .modes button.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .modes button.on small{color:#DCE6F5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:14px 0}
  .card h2{font-size:18px;color:var(--navy)}
  .inputs h2{margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
  .fld .row{display:flex;align-items:center;gap:6px}
  .fld input,.fld select{width:100%;font:inherit;font-size:16px;padding:7px 9px;border:1.5px solid #B9C6DA;border-radius:8px;background:#FFFBEA}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,85,151,.18)}
  .fld .u{font-size:13px;color:var(--sub);white-space:nowrap}
  .fld .hint{font-size:12px;color:var(--sub);margin-top:2px}
  details.adv{margin-top:12px}
  details.adv summary{cursor:pointer;color:var(--blue);font-size:14px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:1.5px solid #B9C6DA;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--navy)}
  .btn:hover{background:#EEF3FA}
  /* 結論 */
  .verdict{border-radius:16px;padding:20px 20px 16px;margin:16px 0;border:2px solid}
  .verdict.ok{background:var(--okbg);border-color:#7BC28F}
  .verdict.ng{background:var(--ngbg);border-color:#E8A19B}
  .verdict .big{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .verdict .mark{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;color:#fff;letter-spacing:.06em}
  .verdict.ok .mark{background:var(--ok)} .verdict.ng .mark{background:var(--ng)}
  .verdict .msg{font-size:clamp(16px,2.6vw,20px);font-weight:700;line-height:1.55;flex:1 1 300px}
  .gauges{margin-top:14px;display:grid;gap:10px}
  .gauge .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
  .gauge .lab b{font-size:15px}
  .bar{position:relative;height:18px;background:#fff;border:1px solid #C7D1E0;border-radius:9px;overflow:hidden;margin-top:3px}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px 0 0 9px}
  .bar .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:#B3261E}
  .bar-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
  /* ステップ */
  .step{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:18px 0;overflow:hidden}
  .step-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#F0F5FC;border-bottom:1px solid var(--line)}
  .num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:18px}
  .step-head h2{font-size:clamp(17px,2.8vw,21px);line-height:1.4;color:var(--navy)}
  .step-body{padding:16px 18px 18px}
  .step-body>*+*{margin-top:14px}
  .lead{font-size:16px}
  .lead b{color:var(--navy)}
  .eq{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto}
  .eq .f{font-size:15px;color:var(--sub)}
  .eq .n{font-size:17px;margin-top:2px}
  .eq .r{font-size:19px;font-weight:800;margin-top:4px}
  .tip{background:var(--tip);border:1px solid var(--tipline);border-left:6px solid #E0A526;border-radius:10px;padding:10px 14px;font-size:15px}
  .tip .tag{display:inline-block;background:#E0A526;color:#fff;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;margin-right:6px}
  .warn{background:var(--ngbg);border:1px solid #E8A19B;border-left:6px solid var(--ng);border-radius:10px;padding:10px 14px;font-size:15px}
  .okbox{background:var(--okbg);border:1px solid #9BD1AA;border-left:6px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:15px}
  svg{display:block;width:100%;height:auto}
  svg.sec{max-width:320px;margin:0 auto}
  .figwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .figwrap svg{min-width:620px}
  @media(max-width:720px){.figwrap::before{content:'← 図は左右にスクロールできます →';display:block;text-align:center;font-size:11px;color:#6B7686;position:sticky;left:0}}
  svg text{font-family:inherit}
  .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 4px}
  .chip{background:#fff;border:2px solid #C7D1E0;border-radius:12px;padding:8px 12px;text-align:center;min-width:112px}
  .chip .t{font-size:12px;color:var(--sub);line-height:1.3}
  .chip .v{font-size:20px;font-weight:800;line-height:1.3}
  .chip .v small{font-size:13px;font-weight:600;margin-left:2px}
  .chip.key{border-color:var(--force);background:#FFF1F0}
  .chip.key .v{color:var(--force)}
  .op{align-self:center;text-align:center;font-size:13px;color:var(--navy);font-weight:700;padding:0 2px;line-height:1.25}
  .op b{display:block;font-size:20px}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:right}
  table.tbl th{background:#F0F5FC;color:var(--navy);text-align:center}
  table.tbl td:first-child,table.tbl th:first-child{text-align:left}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.twocol{grid-template-columns:1fr}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .slider{width:100%;accent-color:var(--blue);height:28px}
  .note{font-size:13px;color:var(--sub)}
  ul.plain{padding-left:1.3em}
  ul.plain li{margin:2px 0}
  footer{margin-top:26px;font-size:13px;color:var(--sub)}
  footer ul{padding-left:1.3em}
  .printbtn{float:right}
  header.hero .screenonly{opacity:.8;font-size:13px}
  @media print{
    body{background:#fff;font-size:12px}
    header.hero{background:#1F3864 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .modes,.inputs,.btnrow,.slider-box,.printbtn,.screenonly{display:none !important}
    .step,.card,.verdict{break-inside:avoid;page-break-inside:avoid}
    .wrap{padding:0}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<header class="hero"><div class="in">
  <h1 id="docTitle">ホイストレール強度検討書</h1>
  <p id="docSub"></p>
  <p class="screenonly">H形鋼のレールが「折れない・大きくたわまない」ことを、図と数字で順番に確かめます。下の数字を変えると、図も説明もすべて自動で変わります。</p>
</div></header>

<div class="wrap">
  <nav class="modes" id="modes"></nav>
  <section class="card inputs" id="inputs"></section>
  <div id="story"></div>
  <footer id="foot"></footer>
</div>

/* =====================================================================
   便利関数
===================================================================== */
function fmt(v, d=2){
  v = Number(v);
  if(!isFinite(v)) return '―';
  if(Math.abs(v) < 0.5*Math.pow(10,-d)) v = 0;
  return v.toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtN(v,d=2){ return fmt(v,d).replace(/^-/,'−'); }
function pct(r){ return fmt(r*100,1)+'%'; }
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmtP=(v,d=2)=> v<0?('('+fmtN(v,d)+')'):fmt(v,d);

/* =====================================================================
   計算エンジン（Excel と同じ解析解）
   x は支点Aからの距離[m]。張り出し側は負。
===================================================================== */
function deflMM(P, L, EI, loads, x){           // 下向き＋ [mm]
  const Lc=L*100, xc=x*100; let res=0;
  for(const a of loads){
    const ac=a*100;
    if(ac>=0){
      const b=Lc-ac;
      if(xc>=0){
        res += (xc<=ac) ? P*b*xc*(Lc*Lc-b*b-xc*xc)/(6*EI*Lc)
                        : P*ac*(Lc-xc)*(2*Lc*xc-xc*xc-ac*ac)/(6*EI*Lc);
      } else { const u=-xc; res += -P*ac*b*(Lc+b)/(6*EI*Lc)*u; }
    } else {
      const c=-ac;
      if(xc>=0){ res += -P*c*xc*(Lc-xc)*(2*Lc-xc)/(6*EI*Lc); }
      else { const u=-xc;
        res += (u>=c) ? P*c*c*(3*u-c)/(6*EI)+P*c*Lc*u/(3*EI)
                      : P*u*u*(3*c-u)/(6*EI)+P*c*Lc*u/(3*EI); }
    }
  }
  return res*10;
}
/* 梁の自重（全長に均等な w[kN/m]）によるたわみ [mm]。x は支点Aからの距離[m] */
function deflSelfMM(w,L,La,EI,x){
  if(!w) return 0;
  const Lc=L*100, Lac=La*100, xc=x*100, wc=w/100, Mo=wc*Lac*Lac/2;
  if(xc>=0) return 10*(wc*xc*(Lc**3-2*Lc*xc*xc+xc**3)/(24*EI) - Mo*xc*(Lc-xc)*(2*Lc-xc)/(6*EI*Lc));
  const u=-xc;
  return 10*(wc*u*u*(6*Lac*Lac-4*Lac*u+u*u)/(24*EI) + Mo*Lc*u/(3*EI) - wc*Lc**3*u/(24*EI));
}
/* 単純梁（＋張り出し）の解析。loads=ホイスト位置の配列(m)。w=梁の自重[kN/m]（-La〜L の全長） */
function analyze(o){
  const {P,L,La,loads,mem,fb0,nd}=o; const w=o.w||0;
  const n=loads.length;
  const hn=i=>n==1?'ホイスト':(i==0?'左ホイスト':'右ホイスト');
  const RBp=loads.reduce((s,a)=>s+P*a,0)/L, RAp=n*P-RBp;
  const RBw=w*(L*L-La*La)/(2*L), RAw=w*(L+La)-RBw;
  const RB=RBp+RBw, RA=RAp+RAw;
  const Mat=x=>{ let m=(x>=0)?RA*x:0; for(const a of loads) m-=P*Math.max(0,x-a); return m-w*(x+La)*(x+La)/2; };
  const Vr=x=>{ let q=(x>=0)?RA:0; for(const a of loads) if(a<=x) q-=P; return q-w*(x+La); };   // 「そのすぐ右」（荷重は a<=x を数える＝安全側）
  const Vl=x=>{ let q=(x>0)?RA:0; for(const a of loads) if(a<x) q-=P; return q-w*(x+La); };      // 「そのすぐ左」
  // 曲げモーメントの山：支間を「0 → 各ホイスト → L」で区切り、各区間でせん断力が0になる場所
  const sb=[0,...loads.map(a=>clamp(a,0,L)),L];
  const segN=n==1?['支点A〜ホイスト','ホイスト〜支点B']:['支点A〜左ホイスト','左ホイスト〜右ホイスト','右ホイスト〜支点B'];
  const peaks=[];
  for(let i=0;i<sb.length-1;i++){
    const k=loads.filter(a=>a<=sb[i]).length;
    const xz = w>0 ? clamp((RA-k*P)/w-La, sb[i], sb[i+1]) : sb[i];
    peaks.push({name:segN[i]+'の間の山',x:xz,v:Mat(xz),k});
  }
  const Mpts=[{k:'A',name:'支点A',x:0,v:Mat(0)}].concat(loads.map((a,i)=>({k:'H'+(i+1),name:hn(i),x:a,v:Mat(a)})));
  const MptsAll=Mpts.concat(peaks);
  const Mmax=Math.max(...MptsAll.map(p=>Math.abs(p.v)));
  const cnt=(x,strict)=>loads.filter(a=>strict?a<x:a<=x).length;
  const Qpts=[{name:'張り出し先端のすぐ右',x:-La,side:'R'},{name:'支点Aのすぐ左',x:0,side:'L'},{name:'支点Aのすぐ右',x:0,side:'R'}];
  loads.forEach((a,i)=>{ Qpts.push({name:hn(i)+'のすぐ左',x:a,side:'L'}); Qpts.push({name:hn(i)+'のすぐ右',x:a,side:'R'}); });
  Qpts.push({name:'支点Bのすぐ左',x:L,side:'R'});
  Qpts.forEach(p=>{ p.v=p.side=='R'?Vr(p.x):Vl(p.x); p.up=(p.side=='R'?(p.x>=0):(p.x>0))?RA:0; p.cnt=cnt(p.x,p.side=='L'); p.selfq=w*(p.x+La); });
  const Qmax=Math.max(...Qpts.map(p=>Math.abs(p.v)));
  const EI=E*mem.Ix, Aw=(mem.H-2*mem.tf)*mem.tw/100, fs=fb0/Math.sqrt(3);
  const dfl=x=>deflMM(P,L,EI,loads,x)+deflSelfMM(w,L,La,EI,x);
  let dmax=0,xd=0; const NG=80;
  for(let j=0;j<=NG;j++){ const x=L*j/NG, v=dfl(x); if(v>dmax){dmax=v;xd=x;} }
  const tip=La>0?dfl(-La):0;
  const da=L*1000/nd;
  const sbb=Mmax*100/mem.Zx, tau=Qmax/Aw;
  return {P,L,La,loads,n,w,RA,RB,RAp,RBp,RAw,RBw,Mat,Vr,Vl,Mpts,peaks,MptsAll,Mmax,Qmax,Qpts,EI,Aw,fs,fb0,dmax,xd,tip,da,sb:sbb,tau,dfl,
          rb:sbb/fb0, rs:tau/fs, rd:dmax/da, mem,nd};
}
function selfW(p){ const m=MEMBER_MAP[p.mem]; return (p.sw!=0)? m.kg*9.81/1000 : 0; }
function scan3(p,n){                          // ホイストを端から端まで動かす（n=1 or 2）
  const m=MEMBER_MAP[p.mem]; const P=(p.W/n+p.Hw)*p.phi*9.81/1000; const w=selfW(p);
  const dd=n==2?p.d:0; const N=120, lo=-p.La, hi=p.L-dd;
  if(hi<lo) return null;
  let worst={rb:0,rs:0,rd:0,xb:lo,xs:lo,xd:lo,RBmin:1e9,xRB:lo,tipmax:-1e9,xtip:lo,RAmax:-1e9,xRAmax:lo,RBmax:-1e9,xRBmax:lo};
  const rows=[];
  for(let i=0;i<=N;i++){
    const x1=lo+(hi-lo)*i/N;
    const r=analyze({P,w,L:p.L,La:p.La,loads:n==2?[x1,x1+p.d]:[x1],mem:m,fb0:p.fb0,nd:p.nd});
    rows.push({x1,rb:r.rb,rs:r.rs,rd:r.rd,RA:r.RA,RB:r.RB,tip:r.tip});
    if(r.rb>worst.rb){worst.rb=r.rb;worst.xb=x1;}
    if(r.rs>worst.rs){worst.rs=r.rs;worst.xs=x1;}
    if(r.rd>worst.rd){worst.rd=r.rd;worst.xd=x1;}
    const rmin=Math.min(r.RA,r.RB);
    if(rmin<worst.RBmin){worst.RBmin=rmin;worst.xRB=x1;}
    if(r.tip>worst.tipmax){worst.tipmax=r.tip;worst.xtip=x1;}
    if(r.RA>worst.RAmax){worst.RAmax=r.RA;worst.xRAmax=x1;}
    if(r.RB>worst.RBmax){worst.RBmax=r.RB;worst.xRBmax=x1;}
  }
  return {rows,worst,P,w,lo,hi};
}

  flow+=op('× φ','衝撃 '+fmt(p.phi,2)+'倍')+chip('衝撃を見込む',fmt(wd,0),'kg');

  const f = n==2 ? 'P ＝ ( W÷2 ＋ Hw ) × φ × 9.81 ÷ 1000' : 'P ＝ ( W ＋ Hw ) × φ × 9.81 ÷ 1000';
  const nn = n==2 ? `P ＝ ( ${fmt(p.W,0)}÷2 ＋ ${fmt(p.Hw,0)} ) × ${fmt(p.phi,2)} × 9.81 ÷ 1000` : `P ＝ ( ${fmt(p.W,0)} ＋ ${fmt(p.Hw,0)} ) × ${fmt(p.phi,2)} × 9.81 ÷ 1000`;
  const wflow = p.sw!=0
    ? `<div class="flow">${chip('梁の重さ wk（部材表）',fmt(mm_.kg,1),'kg/m')}${op('× 9.81','重さ→力')}${chip('力に直すと',fmt(mm_.kg*9.81,1),'N/m')}${op('÷ 1000','N→kN')}${chip('梁の自重 w',fmt(w,3),'kN/m',true)}</div>`

  const body=`<p class="lead">まず、${n==2?'荷物とホイスト':'荷物とホイスト'}の<b>「重さ（kg）」を「力（N：ニュートン）」に直します</b>。重さに <b>9.81</b> を掛けると力になります。</p>

/* 曲げモーメント図の点列（山の位置も含める） */
function mPtsOf(r,La,L,extra){
  const xs=new Set(); const N=200;
  for(let i=0;i<=N;i++) xs.add(+(-La+(L+La)*i/N).toFixed(6));
  [-La,0,L,...r.loads,...(r.peaks||[]).map(q=>q.x),...(extra||[])].forEach(v=>xs.add(+(+v).toFixed(6)));
  return [...xs].filter(x=>x>=-La-1e-9&&x<=L+1e-9).sort((a,b)=>a-b).map(x=>[x,r.Mat(x)]);
}
/* せん断力図の点列 */
function qPtsOf(r,La,L){
  const bp=[...new Set([-La,0,L,...r.loads].map(v=>+(+v).toFixed(6)))].sort((a,b)=>a-b);
  const pts=[], marks=[];
  for(let i=0;i<bp.length-1;i++){
    const a=bp[i], b=bp[i+1];
    if(b-a<1e-9) continue;
    const va=r.Vr(a), vb=r.Vl(b);
    pts.push([a,va],[b,vb]);
    const vm=(va+vb)/2;
    if(Math.max(Math.abs(va),Math.abs(vb))>1e-6) marks.push({x:(a+b)/2,v:vm,label:fmtN(vm,2)});
  }
  return {pts,marks,bp};
}

    ${plotSVG(fr,dpts,{title:'たわみ図（下向きが「下がる」向き／数字は実際の大きさ）',color:'#1565C0',down:true,guides:gd,marks:dm,h:190,foot:'mm　※図は見やすいよう縦方向を大きく描いています'})}
    <p class="lead">${two?'左のホイストだけが作るたわみ、右のホイストだけが作るたわみ':'ホイストだけが作るたわみ'}${w>0?'、梁の自重だけが作るたわみ':''}を、それぞれ材料力学の公式で求めて<b>足し合わせます</b>（重ね合わせ）。梁を細かく区切って一番下がる場所を探すと、支点Aから <b>${fmt(r.xd,2)} m</b> の位置でした。</p>
    ${eq('たわみの限度 δa ＝ L ÷ n',`δa ＝ ${fmt(L,2)} m × 1000 ÷ ${fmt(p.nd,0)}`,`限度 δa ＝ ${fmt(r.da,3)} mm　／　実際 δ ＝ ${fmt(r.dmax,3)} mm`)}
    ${tip(`${fmt(r.dmax,1)}mm は、1円玉（厚さ1.5mm）を約 ${fmt(r.dmax/1.5,1)} 枚重ねた高さ。これが限度の ${fmt(r.da,1)}mm（1円玉 約 ${fmt(r.da/1.5,1)} 枚）より小さければOKです。`)}
    ${La>0?`<p class="note">参考：張り出し先端は、この位置にホイストがあるとき ${r.tip>=0?'下に':'上に'} ${fmt(Math.abs(r.tip),2)} mm 動きます（プラス＝下がる、マイナス＝跳ね上がる）。</p>`:''}`);
  // ---- STEP 6
  const s6=stepJudge(6,r);
  // ---- 位置を動かす
  const sc=scan3(p,n);
  let s7='', s8='';
  if(sc){
    const wv=sc.worst;
    const W2=920,Hc=210,padL=56,padR=20,top=20,bot=34; const ymax=Math.max(1.15,wv.rb*1.1,wv.rs*1.1,wv.rd*1.1);
    const X=x=>padL+(x-sc.lo)/((sc.hi-sc.lo)||1)*(W2-padL-padR), Y=v=>top+(ymax-v)/ymax*(Hc-top-bot);
    const line=(key,col)=>'<polyline fill="none" stroke="'+col+'" stroke-width="2.6" points="'+sc.rows.map(q=>X(q.x1).toFixed(1)+','+Y(q[key]).toFixed(1)).join(' ')+'"/>';
    let ch=`<svg viewBox="0 0 ${W2} ${Hc}" role="img" aria-label="ホイスト位置と使用率">`;
    for(let g=0;g<=ymax;g+=0.25){ ch+=`<line x1="${padL}" x2="${W2-padR}" y1="${Y(g)}" y2="${Y(g)}" stroke="#E3E8F0"/><text x="${padL-6}" y="${Y(g)+4}" font-size="11" text-anchor="end" fill="#6B7686">${Math.round(g*100)}%</text>`; }
    ch+=`<line x1="${padL}" x2="${W2-padR}" y1="${Y(1)}" y2="${Y(1)}" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5"/><text x="${W2-padR}" y="${Y(1)-5}" font-size="12" text-anchor="end" fill="#B3261E" font-weight="700">限度 100%</text>`;
    ch+=line('rb','#E65100')+line('rs','#6A1B9A')+line('rd','#1565C0');
    ch+=`<line x1="${X(x1)}" x2="${X(x1)}" y1="${top-6}" y2="${Hc-bot}" stroke="#333" stroke-dasharray="3 3"/><text x="${X(x1)}" y="${top-8}" font-size="11" text-anchor="middle" fill="#333">今の位置</text>`;
    ch+=`<text x="${padL}" y="${Hc-10}" font-size="12" fill="#6B7686">← ${two?'左ホイスト':'ホイスト'}が張り出し先端にある（x1＝${fmtN(sc.lo,2)}m）</text><text x="${W2-padR}" y="${Hc-10}" font-size="12" text-anchor="end" fill="#6B7686">${two?'右ホイスト':'ホイスト'}が支点Bの真上にある（x1＝${fmtN(sc.hi,2)}m） →</text></svg>`;
    const allok=wv.rb<=1&&wv.rs<=1&&wv.rd<=1;
    s7=step(7,'ホイストを梁の上で動かしたら？（一番きびしい位置の確認）',`
      <p class="lead">実際の作業では、ホイストは梁の上を動きます。そこで、${two?'2台のホイスト（間隔 d のまま）':'ホイスト'}を<b>張り出し先端から支点Bまで少しずつずらして</b>、位置ごとの使用率を調べました。</p>
      ${ch}<div class="legend"><span><i style="background:#E65100"></i>曲げ</span><span><i style="background:#6A1B9A"></i>せん断</span><span><i style="background:#1565C0"></i>たわみ</span></div>
      <table class="tbl"><tr><th>項目</th><th>一番きびしい使用率</th><th>そのときの位置 x1</th></tr>
        <tr><td>曲げ</td><td><b>${pct(wv.rb)}</b></td><td>${fmtN(wv.xb,2)} m</td></tr>
        <tr><td>せん断</td><td><b>${pct(wv.rs)}</b></td><td>${fmtN(wv.xs,2)} m</td></tr>
        <tr><td>たわみ（支点間）</td><td><b>${pct(wv.rd)}</b></td><td>${fmtN(wv.xd,2)} m</td></tr></table>
      ${allok?`<div class="okbox"><b>どの位置にホイストがきても、3項目とも 100% 以下です。</b>ホイストが梁の上のどこにあっても安全です。</div>`:`<div class="warn"><b>位置によっては 100% を超えます。</b>ホイストを動かす範囲を制限するか、部材を大きくしてください。</div>`}
      ${wv.RBmin<0?`<div class="warn"><b>浮き上がりに注意：</b>ホイストが張り出し先端に近い位置では、反力がマイナス（最大 ${fmt(-wv.RBmin,2)} kN の引き抜き力）になります。支点をボルトなどで固定してください。</div>`:''}
      ${La>0?`<p class="note">参考：張り出し先端は、ホイストが先端にあるとき最大 ${fmt(wv.tipmax,2)} mm 下がります（張り出し長さ ${fmt(La,2)}m の 1/${fmt(La*1000/Math.max(wv.tipmax,1e-9),0)}）。</p>`:''}`);
    const minRB=Math.min(...sc.rows.map(q=>q.RB)), minRA=Math.min(...sc.rows.map(q=>q.RA));
    s8=anchorStep(8,`<table class="tbl"><tr><th>項目</th><th>支点A</th><th>支点B</th></tr>
      <tr><td>今の位置での力（＋は下向きに押す力）</td><td>${fmtN(r.RA,2)} kN</td><td>${fmtN(r.RB,2)} kN</td></tr>
      <tr><td>どの位置でも最大の力（押す向き）</td><td><b>${fmt(wv.RAmax,2)} kN</b><br><span class="note">x1＝${fmtN(wv.xRAmax,2)} m のとき</span></td><td><b>${fmt(wv.RBmax,2)} kN</b><br><span class="note">x1＝${fmtN(wv.xRBmax,2)} m のとき</span></td></tr>
      <tr><td>どの位置でも最小の力（マイナス＝引き抜く向き）</td><td><b>${fmtN(minRA,2)} kN</b></td><td><b>${fmtN(minRB,2)} kN</b></td></tr></table>
      ${(minRA<0||minRB<0)?`<div class="warn"><b>引き抜き力がはたらきます。</b>ホイストが張り出しに出る位置では、${minRB<0?'支点B':'支点A'}が浮き上がろうとし、最大 ${fmt(-Math.min(minRA,minRB),2)} kN の引き抜き力になります。固定部（アンカー等）は、この力に耐える必要があります。</div>`:`<div class="okbox">どの位置でも支点は「押す向き」だけで、引き抜く向きの力ははたらきません。</div>`}
      <p class="note">押す向きの最大の力は、アンカーのせん断力・コンクリートの支圧の検討に、引き抜き力は、アンカーの引き抜きの検討に使います。</p>`);
  }
  const rv=sc?{...r,rb:Math.max(r.rb,sc.worst.rb),rs:Math.max(r.rs,sc.worst.rs),rd:Math.max(r.rd,sc.worst.rd)}:r;
  return {html: verdictHTML(rv,`スパン ${fmt(L,2)}m・張り出し ${fmt(La,2)}m${two?`・吊り間隔 ${fmt(p.d,2)}m`:''}`,`荷物 ${fmt(p.W,0)}kg ＋ ホイスト自重 ${fmt(p.Hw,0)}kg${two?'×2台':''}${p.sw!=0?' ＋ 梁の自重':'（梁の自重は含まない）'}`,!!sc)
    + `<section class="card"><h2>今回の条件</h2><p class="note" style="margin:4px 0 8px">梁は2つの支点（A・B）で支えられ、支点Aの外側に張り出し${two?'があります。2台のホイストで、長い荷物を吊ります。':'（なしの場合は 0）があります。ホイストは1台で、梁の上（張り出し先端〜支点B）のどこにでも動かせます。'}</p>${beam0}${slider}</section>`
    + `<p class="note" style="margin:14px 4px 0"><b>どうして安全と言えるの？</b>　次の順番で、ひとつずつ確かめます。</p>`
    + sf.html + s2 + s3 + s4 + s5 + s6 + s7 + s8};
}

/* =====================================================================
   ② 片持ち梁
===================================================================== */
function render2(){
  const p=S[2]; const m=MEMBER_MAP[p.mem]; const Lc=p.Lc;
  const sf=stepForce(p,1); const P=sf.P, w=sf.w;
  const EI=E*m.Ix, Aw=(m.H-2*m.tf)*m.tw/100, fs=p.fb0/Math.sqrt(3);
  const Mp=P*Lc, Mw=w*Lc*Lc/2, M=Mp+Mw, Qp=P, Qw=w*Lc, Q=Qp+Qw, sb=M*100/m.Zx, tau=Q/Aw;
  const dP=P*Math.pow(Lc*100,3)/(3*EI)*10, dW=(w/100)*Math.pow(Lc*100,4)/(8*EI)*10, dmax=dP+dW, da=Lc*1000/p.nd;
  const r={mem:m,Aw,fs,fb0:p.fb0,M,Q,sb,tau,dmax,da,rb:sb/p.fb0,rs:tau/fs,rd:dmax/da};
  const Mall=p.fb0*m.Zx/100;
  const Lb = w>0 ? (-P+Math.sqrt(P*P+2*w*Mall))/w : Mall/P;
  const Ls = w>0 ? Math.max(0,(fs*Aw-P)/w) : (P<=fs*Aw?Infinity:0);
  let xL=Math.sqrt(3*EI/(P*p.nd)); const L0=xL;
  for(let k=0;k<6;k++){ const f=P*xL*xL/(3*EI)+(w/100)*xL**3/(8*EI)-1/p.nd, df=2*P*xL/(3*EI)+3*(w/100)*xL*xL/(8*EI); xL-=f/df; }
  const Ld=xL/100;
  const Lmax=Math.floor(Math.min(Lb,Ld,Ls)*100)/100;
  const fr=frame(0,Lc,90,70);
  const loads=[{x:Lc,label:`P＝${fmt(P,2)}kN`,tag:'ホイスト'}];
  const dims=[{a:0,b:Lc,y:210,label:`張り出し長さ Lc＝${fmt(Lc,2)}m`}];
  const s0=`<section class="card"><h2>今回の条件</h2><p class="note" style="margin:4px 0 8px">壁や鉄骨から梁を片側だけ固定して横へ張り出し、その先端にホイストを載せる場合です。</p>${beamSVG(fr,{loads,dims,wall:true,h:250,selfw:selfLabel(w)})}</section>`;
  const NM=100; const ptsM=[]; for(let i=0;i<=NM;i++){ const x=Lc*i/NM; ptsM.push([x,P*(Lc-x)+w*(Lc-x)*(Lc-x)/2]); }
  const s2=step(2,'梁の根元は、どれくらいの力で曲げられている？（曲げモーメント）',`
    <p class="lead">片側だけ固定した梁の先にものをぶら下げると、<b>根元が一番強く曲げられます</b>。曲げる力の大きさを<b>曲げモーメント M</b>といい、<b>「力 × 距離」</b>で表します。先端の力 P が、根元から Lc の距離にあります。${w>0?'梁自身の重さ（w×Lc）は梁全体に均等にかかり、その中心（根元から Lc÷2）にあると考えるので、Mw ＝ (w×Lc) × (Lc÷2) ＝ w×Lc²÷2 です。':''}</p>
    ${plotSVG(fr,ptsM,{title:'曲げモーメント図（山が高いほど、強く曲げられている）',color:'#E65100',guides:[0,Lc],marks:[{x:0,v:M,label:fmt(M,2)+' kN・m'}],h:170,foot:'kN・m　※根元では上側が引っぱられる向き（大きさで表示）'})}
    ${eq('ホイスト分：Mp ＝ P × Lc',`Mp ＝ ${fmt(P,3)} × ${fmt(Lc,2)}`,`Mp ＝ ${fmt(Mp,3)} kN・m`)}
    ${w>0?eq('梁の自重分：Mw ＝ w × Lc² ÷ 2',`Mw ＝ ${fmt(w,3)} × ${fmt(Lc,2)}² ÷ 2`,`Mw ＝ ${fmt(Mw,3)} kN・m`):''}
    ${eq('M ＝ Mp ＋ Mw',`M ＝ ${fmt(Mp,3)} ＋ ${fmt(Mw,3)}`,`M ＝ ${fmt(M,3)} kN・m`)}
    ${tip('定規の端を机に押さえて、先におもりを吊るすと、机のふち（根元）で一番曲がります。張り出しが長いほど、距離が伸びるので、曲げモーメントも大きくなります。')}`);
  const s3=step(3,'梁は、どれくらいの力でずらし切られそうになっている？（せん断力）',`
    <p class="lead">ハサミで紙を切るときの、2枚の刃がずれる力が<b>せん断力 Q</b>です。片持ち梁では、先端の力 P${w>0?'と、梁自身の重さ（w×Lc）':''}が<b>そのまま根元まで</b>伝わります。根元が一番大きくなります。</p>
    ${plotSVG(fr,[[0,Q],[Lc,P]],{title:'せん断力図',color:'#6A1B9A',guides:[0,Lc],marks:[{x:0,v:Q,label:fmt(Q,2)+' kN'}],h:150,foot:'kN'})}
    ${eq('ホイスト分：Qp ＝ P',`Qp ＝ ${fmt(P,3)}`,`Qp ＝ ${fmt(Qp,3)} kN`)}
    ${w>0?eq('梁の自重分：Qw ＝ w × Lc',`Qw ＝ ${fmt(w,3)} × ${fmt(Lc,2)}`,`Qw ＝ ${fmt(Qw,3)} kN`):''}
    ${eq('Q ＝ Qp ＋ Qw',`Q ＝ ${fmt(Qp,3)} ＋ ${fmt(Qw,3)}`,`Q ＝ ${fmt(Q,3)} kN`)}`);
  const NS=120; const dpp=[]; for(let i=0;i<=NS;i++){ const x=Lc*i/NS, xc=x*100; dpp.push([x,(P*xc*xc*(3*Lc*100-xc)/(6*EI)+(w/100)*xc*xc*(6*(Lc*100)**2-4*Lc*100*xc+xc*xc)/(24*EI))*10]); }
  const s4=step(4,'梁の先端は、どれくらい下がる？（たわみ）',`
    <p class="lead">先端にホイストが載ると、梁の先が下がります。下がりすぎないよう、<b>「張り出し長さの ${fmt(p.nd,0)} 分の 1 以下」</b>に抑えます。</p>
    ${plotSVG(fr,dpp,{title:'たわみ図（下向きが「下がる」向き／数字は実際の大きさ）',color:'#1565C0',down:true,guides:[0,Lc],marks:[{x:Lc,v:dmax,label:fmt(dmax,2)+' mm'}],h:170,foot:'mm　※図は見やすいよう縦方向を大きく描いています'})}
    ${eq('ホイスト分：δp ＝ P × Lc³ ÷ ( 3 × E × Ix )（材料力学の公式）',`δp ＝ ${fmt(P,3)} × (${fmt(Lc*100,0)}cm)³ ÷ ( 3 × ${fmt(E,0)} × ${fmt(m.Ix,0)} ) × 10`,`δp ＝ ${fmt(dP,3)} mm`)}
    ${w>0?eq('梁の自重分：δw ＝ w × Lc⁴ ÷ ( 8 × E × Ix )（w は kN/cm に直す）',`δw ＝ ${fmt(w/100,5)} × (${fmt(Lc*100,0)}cm)⁴ ÷ ( 8 × ${fmt(E,0)} × ${fmt(m.Ix,0)} ) × 10`,`δw ＝ ${fmt(dW,3)} mm`):''}
    ${eq('δ ＝ δp ＋ δw　／　限度 δa ＝ Lc ÷ n',`δ ＝ ${fmt(dP,3)} ＋ ${fmt(dW,3)}　／　δa ＝ ${fmt(Lc,2)} m × 1000 ÷ ${fmt(p.nd,0)}`,`実際 δ ＝ ${fmt(dmax,3)} mm　／　限度 δa ＝ ${fmt(da,3)} mm`)}`);
  const s5=stepJudge(5,r);
  const s6=step(6,'おまけ：この梁は、何メートルまで張り出せる？',`
    <p class="lead">同じ部材・同じ荷物のまま、張り出しをどこまで長くできるかを逆算します。曲げ・せん断・たわみのそれぞれで限界の長さを求め、<b>一番短いもの</b>が「最大の張り出し長さ」です。${w>0?'梁の自重は張り出しが長いほど重くなるので、曲げとたわみの限界の長さは少し短くなります。':''}</p>
    <table class="tbl"><tr><th>検討項目</th><th>数字を入れると</th><th>限界の長さ</th></tr>
     <tr><td>曲げから</td><td style="text-align:left">${w>0?`Lb ＝ (−P ＋ √(P² ＋ 2×w×Mall)) ÷ w　（Mall ＝ fb0×Zx÷100 ＝ ${fmt(Mall,3)} kN・m）`:`Lb ＝ Mall ÷ P ＝ ${fmt(p.fb0,1)} × ${fmt(m.Zx,1)} ÷ 100 ÷ ${fmt(P,3)}`}</td><td><b>${fmt(Lb,3)} m</b></td></tr>
     <tr><td>せん断から</td><td style="text-align:left">${w>0?`Ls ＝ (fs×Aw − P) ÷ w ＝ (${fmt(fs,3)}×${fmt(Aw,2)} − ${fmt(P,3)}) ÷ ${fmt(w,3)}`:`張り出し長さに関係しない（${Ls>0?'OK':'NG'}）`}</td><td><b>${Ls===Infinity?'制限なし':fmt(Ls,3)+' m'}</b></td></tr>
     <tr><td>たわみから</td><td style="text-align:left">${w>0?`P×L²÷(3EI) ＋ w×L³÷(8EI) ＝ 1÷n となる L を、くり返し計算（ニュートン法）で求める。出発点 L0 ＝ √(3×E×Ix÷(P×n)) ＝ ${fmt(L0,1)} cm`:`Ld ＝ √(3×E×Ix ÷ (P×n)) ÷ 100 ＝ √(3×${fmt(E,0)}×${fmt(m.Ix,0)} ÷ (${fmt(P,3)}×${fmt(p.nd,0)})) ÷ 100`}</td><td><b>${fmt(Ld,3)} m</b></td></tr></table>
    ${eq('最大の張り出し長さ（小数第2位で切り捨て）',`Lmax ＝ 一番短いもの`,`Lmax ＝ ${fmt(Lmax,2)} m`)}
    <div class="${Lc<=Lmax?'okbox':'warn'}">今の張り出し ${fmt(Lc,2)} m は、限界の ${fmt(Lmax,2)} m ${Lc<=Lmax?`以内です（余裕 ${fmt(Lmax-Lc,2)} m）。`:'を超えています。'}</div>`);
  const s7=anchorStep(7,`<table class="tbl"><tr><th>項目</th><th>値</th></tr>
      <tr><td>根元にかかる下向きの力 V ＝ Q<br><span class="note">アンカーのせん断力の検討に使います</span></td><td><b>${fmt(Q,2)} kN</b></td></tr>
      <tr><td>根元にかかる曲げモーメント M<br><span class="note">上側のアンカーを引き抜く力と、下側を押しつける力の組み合わせで受けます</span></td><td><b>${fmt(M,2)} kN・m</b></td></tr></table>
      <div class="tip"><span class="tag">目安</span>上下のアンカー（または固定部）の間隔を z (m) とすると、上側を引き抜く力は T ≒ M ÷ z (kN) で、大まかな値が分かります。実際の分担は、アンカーの配置や梁の剛性で変わるため、固定部の設計基準で確認してください。</div>`);
  return {html: verdictHTML(r,`張り出し ${fmt(Lc,2)}m・先端に吊る`,`荷物 ${fmt(p.W,0)}kg ＋ ホイスト自重 ${fmt(p.Hw,0)}kg${p.sw!=0?' ＋ 梁の自重':'（梁の自重は含まない）'}`)+s0+`<p class="note" style="margin:14px 4px 0"><b>どうして安全と言えるの？</b>　次の順番で、ひとつずつ確かめます。</p>`+sf.html+s2+s3+s4+s5+s6+s7};
}

/* =====================================================================
   画面の組み立て

function buildModes(){
  $('modes').innerHTML=[1,2,3].map(k=>`<button data-m="${k}" class="${k===mode?'on':''}">${MODE_INFO[k][0]}<small>${MODE_INFO[k][1]}</small></button>`).join('');
  $('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{ mode=+b.dataset.m; buildModes(); buildInputs(); draw(); });
}
function buildInputs(){
  const s=S[mode]; const flds=FIELDS[mode];
  let h=`<h2>条件を入れる <button class="btn printbtn" onclick="window.print()">印刷する</button></h2><div class="grid">
   <div class="fld" style="grid-column:span 2"><label for="f_title">表題（印刷の一番上に出ます）</label><input id="f_title" type="text" value="${escH(DOC.title)}"></div>
   <div class="fld" style="grid-column:span 2"><label for="f_proj">件名・工事名など（空欄なら表示しません）</label><input id="f_proj" type="text" value="${escH(DOC.proj)}" placeholder="例：○○工場 ホイストレール設置工事"></div>`;
  flds.forEach(([k,lab,u,st,hint])=>{ h+=`<div class="fld"><label for="f_${k}">${lab}</label><div class="row"><input id="f_${k}" data-k="${k}" type="number" inputmode="decimal" step="${st}" value="${s[k]}"><span class="u">${u}</span></div>${hint?`<div class="hint">${hint}</div>`:''}</div>`; });
  h+=`<div class="fld" style="grid-column:1/-1"><label for="f_mem">使用する部材（H形鋼・I形鋼）</label><select id="f_mem">${memberOptions(s.mem)}</select></div>
   <div class="fld" style="grid-column:1/-1"><label for="f_sw">梁の自重（梁自身の重さ）</label><select id="f_sw"><option value="1"${s.sw!=0?' selected':''}>考慮する（安全側・おすすめ）</option><option value="0"${s.sw==0?' selected':''}>考慮しない</option></select><div class="hint">梁(H形鋼)自身の重さも計算に入れるかどうかを選びます</div></div></div>`;
  h+=`<details class="adv"><summary>くわしい設定（ふだんは変えなくてOK）</summary><div class="grid" style="margin-top:10px">
   <div class="fld"><label for="f_phi">衝撃係数 φ</label><div class="row"><input id="f_phi" data-k="phi" type="number" step="0.05" value="${s.phi}"><span class="u">倍</span></div><div class="hint">通常 1.2</div></div>
   <div class="fld"><label for="f_fb0">許容曲げ応力度 fb0</label><div class="row"><input id="f_fb0" data-k="fb0" type="number" step="0.1" value="${s.fb0}"><span class="u">kN/cm²</span></div><div class="hint">SS400（板厚40mm以下）は 15.6</div></div>
   <div class="fld"><label for="f_nd">たわみの制限 1/n</label><div class="row"><input id="f_nd" data-k="nd" type="number" step="50" value="${s.nd}"><span class="u">（n）</span></div><div class="hint">${mode==2?'片持ちは 300〜500':'クレーン用レールは 800'}</div></div></div></details>`;
  h+=`<div class="btnrow"><button class="btn" id="resetBtn">はじめの条件に戻す</button><button class="btn" id="saveFileBtn">条件をファイルに保存</button><button class="btn" id="loadFileBtn">保存したファイルを読み込む</button><input id="loadFile" type="file" accept=".json,application/json" style="display:none"></div>
   <p class="note" style="margin-top:6px">入れた条件は、自動で<b>このパソコンのこのブラウザ</b>に保存され、次に開いたときも残ります。別のパソコンへ移したいときや、案件ごとに残したいときは「条件をファイルに保存」を使います。</p>`;
  $('inputs').innerHTML=h;
  $('inputs').querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); if(isFinite(v)){ S[mode][inp.dataset.k]=v; draw(); } }));
  $('f_title').addEventListener('input',e=>{ DOC.title=e.target.value; updateHero(); saveState(); });
  $('f_proj').addEventListener('input',e=>{ DOC.proj=e.target.value; updateHero(); saveState(); });
  $('f_mem').addEventListener('change',e=>{ S[mode].mem=e.target.value; draw(); });
  $('f_sw').addEventListener('change',e=>{ S[mode].sw=+e.target.value; draw(); });
  $('resetBtn').onclick=()=>{ S[mode]={...DEF[mode]}; buildInputs(); draw(); };
  $('saveFileBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(snapshot(),null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const nm=(DOC.proj||'ホイストレール条件').replace(/[\\/:*?"<>|]/g,'_'); a.download=nm+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  };
  $('loadFileBtn').onclick=()=>$('loadFile').click();
  $('loadFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ if(applySnapshot(JSON.parse(rd.result))){ buildModes(); buildInputs(); draw(); } else alert('読み込めませんでした'); }catch(err){ alert('このファイルは読み込めません'); } };
    rd.readAsText(f);
  });
}
function bindDynamic(){
  const sl=$('x1s'); if(sl){ sl.addEventListener('input',()=>{ S[mode].x1=parseFloat(sl.value); draw(true); }); }
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const p=S[mode]; const n=mode==3?2:1; const dd=n==2?p.d:0; const lo=-Math.max(0,p.La), hi=p.L-dd; const sc=scan3(p,n);
    if(b.dataset.go==='worst' && sc) p.x1=sc.worst.xb;
    if(b.dataset.go==='mid') p.x1=(p.L-dd)/2;
    if(b.dataset.go==='reset') p.x1=DEF[mode].x1;
    p.x1=clamp(p.x1,lo,hi); draw(true);
  });
}
function draw(keepScroll){
  const y=window.scrollY; saveState();
  updateHero();
  const out = mode===2?render2():renderBeam(mode);
  $('story').innerHTML = typeof out==='string'?out:out.html;
  bindDynamic();
  if(keepScroll) window.scrollTo(0,y);
}
$('foot').innerHTML=`<h2 style="font-size:16px;color:var(--navy);margin-bottom:6px">前提条件・注意</h2><ul>
 <li>SS400のH形鋼（またはI形鋼）で、<b>上のフランジを固定し、下のフランジにトロリー（ホイスト）を載せる</b>使い方を前提としています。この場合、横倒れ座屈（梁が横にねじれて倒れる現象）の検討は省略しています。</li>
 <li>梁自身の重さは、画面の「梁の自重」で<b>考慮する／しない</b>を切り替えられます（初期値は「考慮する」）。梁は全長（張り出し部分を含む）に均等な重さがかかるものとして計算します。</li>
 <li>許容応力度：fb0 ＝ 15.6 kN/cm²（SS400）、せん断 fs ＝ fb0 ÷ √3 ≒ 9.0 kN/cm²。ヤング係数 E ＝ 21,000 kN/cm²。</li>
 <li>断面の数値は JIS G 3192（H形鋼・I形鋼）の断面性能表によります。</li>
 <li>梁を支える柱・ブラケット・ボルト・アンカー（支点まわり・固定部）そのものの検討は、この計算には含まれません。それらの検討に使う支点の力は、各画面の最後にある「アンカー・支点の検討に使う力」に示しています。走行やブレーキで生じる水平力は含みません。</li></ul>
`;
loadState(); buildModes(); buildInputs(); draw();
</script>
</body>
</html>
